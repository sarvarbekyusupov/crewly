limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

upstream backend  { server backend:3000;  }
upstream frontend { server frontend:3000; }

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_vary on;

# Redirect HTTP → HTTPS
server {
  listen 80;
  server_name _;

  location = /health {
    proxy_pass http://backend/health;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# Redirect www → non-www (HTTPS)
server {
  listen 443 ssl http2;
  server_name www.crewly.uz;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  return 301 https://crewly.uz$request_uri;
}

# Main server
server {
  listen 443 ssl http2;
  server_name crewly.uz _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  # Security headers
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options    nosniff                                always;
  add_header X-Frame-Options           DENY                                   always;
  add_header X-XSS-Protection          "1; mode=block"                        always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

  client_max_body_size 25m;

  # API + webhooks → backend
  location ~ ^/(api|webhooks)/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass         http://backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        '';
    proxy_buffering    off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding on;
  }

  # Health check
  location = /health {
    proxy_pass http://backend/health;
  }

  # Static images — long cache (30 days)
  location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
    proxy_pass         http://frontend;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    add_header Cache-Control "public, max-age=2592000";
  }

  # Everything else → Nuxt frontend
  location / {
    proxy_pass         http://frontend;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
    proxy_cache_bypass $http_upgrade;
  }
}
