upstream backend  { server backend:3000;  }
upstream frontend { server frontend:3000; }

# Redirect HTTP → HTTPS (health bypassed for smoke tests / uptime monitors)
server {
  listen 80;
  server_name _;

  location = /health {
    proxy_pass http://backend/health;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  # Security headers
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options    nosniff;
  add_header X-Frame-Options           DENY;
  add_header X-XSS-Protection          "1; mode=block";

  client_max_body_size 25m;

  # API + webhooks → backend
  location ~ ^/(api|webhooks)/ {
    proxy_pass         http://backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # SSE requires: no buffering, no timeout
    proxy_set_header   Connection        '';
    proxy_buffering    off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding on;
  }

  # Health check (no TLS redirect loop)
  location = /health {
    proxy_pass http://backend/health;
  }

  # Everything else → Nuxt frontend
  location / {
    proxy_pass         http://frontend;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
    proxy_cache_bypass $http_upgrade;
  }
}
