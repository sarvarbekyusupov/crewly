services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: myhr
      POSTGRES_PASSWORD: myhr
      POSTGRES_DB: myhr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myhr"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3030:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      PUBLIC_URL: http://localhost:3030
      FRONTEND_URL: http://localhost:4001
      DATABASE_URL: postgresql://myhr:myhr@postgres:5432/myhr
      DIRECT_URL: postgresql://myhr:myhr@postgres:5432/myhr
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set (min 32 chars)}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set (min 32 chars)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set (min 32 chars)}
      JWT_CANDIDATE_SECRET: ${JWT_CANDIDATE_SECRET:-dev-jwt-candidate-secret-change-prod-32}
      BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD:-dev-bull-board-password}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3030/api/v1/candidate-auth/google/callback}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      HH_EMPLOYER_TOKEN: ${HH_EMPLOYER_TOKEN:-}
      HH_EMPLOYER_ID: ${HH_EMPLOYER_ID:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
    command: ["sh", "-c", "./node_modules/.bin/prisma migrate deploy && node dist/backend/src/main"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4001:3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:3030
      NUXT_HOST: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
