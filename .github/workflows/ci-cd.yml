name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/crewly-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/crewly-frontend

jobs:
  # ─── Build & Push Docker images ─────────────────────────────────────────────
  build-push:
    name: Build & Push Images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NUXT_PUBLIC_API_BASE=${{ secrets.PUBLIC_URL }}
            NUXT_PUBLIC_WAITLIST_MODE=${{ vars.WAITLIST_MODE || 'false' }}
            BACKEND_URL=http://backend:3000
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GITHUB_SHA,GITHUB_ACTOR,GITHUB_REPOSITORY_OWNER
          script: |
            set -e
            cd /srv/crewly
            export IMAGE_BACKEND=ghcr.io/$GITHUB_REPOSITORY_OWNER/crewly-backend:$GITHUB_SHA
            export IMAGE_FRONTEND=ghcr.io/$GITHUB_REPOSITORY_OWNER/crewly-frontend:$GITHUB_SHA
            echo "IMAGE_BACKEND=$IMAGE_BACKEND"   > .env.images
            echo "IMAGE_FRONTEND=$IMAGE_FRONTEND" >> .env.images
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            docker system prune -f
            docker image prune -af
            docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.images pull
            docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.images up -d --remove-orphans
            sleep 15
            curl -sf http://localhost/health && echo "Deploy OK" || { docker compose -f docker-compose.prod.yml logs --tail=40; exit 1; }
            docker image prune -f
